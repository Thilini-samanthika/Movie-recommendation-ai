# Server Port Configuration
server.port=8080
spring.application.name=movieai

# ==========================================
# MySQL Database Configuration (XAMPP / Local)
# ==========================================
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:mysql://localhost:3306/movie_ai_db?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:root}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# ==========================================
# JPA / Hibernate Configuration
# ==========================================
# Automatically update Database Tables from Entities
spring.jpa.hibernate.ddl-auto=update

# Show SQL queries in VS Code Terminal for debugging
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Open In View Setting
spring.jpa.open-in-view=true

# ==========================================
# Swagger & OpenAPI Specs Configuration
# ==========================================
springdoc.api-docs.path=/api-docs
springdoc.swagger-ui.path=/swagger-ui.html

# ==========================================
# Python AI Recommendation Microservice
# ==========================================
ai.service.url=${AI_SERVICE_URL:http://localhost:8000}