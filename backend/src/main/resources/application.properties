# Server Port Configuration
server.port=8080
spring.application.name=movieai

# ==========================================
# MySQL Database Configuration (XAMPP / Local)
# ==========================================
spring.datasource.url=jdbc:mysql://localhost:3306/movie_ai_db?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
spring.datasource.username=root
spring.datasource.password=
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# ==========================================
# JPA / Hibernate Configuration
# ==========================================
# Automatically update Database Tables from Entities
spring.jpa.hibernate.ddl-auto=update

# Show SQL queries in VS Code Terminal for debugging
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Open In View Setting
spring.jpa.open-in-view=true

# ==========================================
# Swagger & OpenAPI Specs Configuration
# ==========================================
springdoc.api-docs.path=/api-docs
springdoc.swagger-ui.path=/swagger-ui.html